[package]
name = "stellarpass-contract"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["floxxih <harobedjosh@gmail.com>"]

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "25.0.0"

[dev-dependencies]
soroban-sdk = { version = "25.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
